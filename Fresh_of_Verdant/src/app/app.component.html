<ion-app>
  <ion-menu contentId="main-content" [disabled]="!showMenu">
    <ion-content>
      <div class="menu-head" routerLink="/profile">
        <!-- Avatar placeholder: replace with <img> later -->
        <div class="avatar img-ph"><ion-icon name="person-outline"></ion-icon></div>
        <h2>John Doe</h2>
        <p><ion-icon name="call-outline"></ion-icon> +63 912 345 6789</p>
      </div>

      <nav class="menu-list">
        @for (item of menuItems; track item.url) {
          <ion-menu-toggle [autoHide]="false">
            <a class="menu-item" [routerLink]="item.url" routerLinkActive="active">
              <ion-icon [name]="item.icon"></ion-icon>
              <span>{{ item.title }}</span>
              @if (item.badge && cart.count() > 0) {
                <em class="count">{{ cart.count() }}</em>
              }
            </a>
          </ion-menu-toggle>
        }
      </nav>

      <div class="menu-foot">
        <ion-menu-toggle [autoHide]="false">
          <button class="logout" (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon> Logout
          </button>
        </ion-menu-toggle>
        <small>FRESH MARKET • VERSION 2.4.0</small>
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
